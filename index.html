<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>首頁 - 定期考考卷上傳系統</title>

    <!-- 快速原型：使用 Tailwind CDN（僅建議用於開發/示範） -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f7f7f7;
            margin: 0;
        }

        .container {
            max-width: 400px;
            margin: 80px auto;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 8px #0001;
            padding: 32px;
        }

        h1 {
            text-align: center;
            color: #333;
        }

        .email {
            margin: 24px 0;
            text-align: center;
            font-size: 1.2em;
            color: #0070f3;
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 4px;
            background: #0070f3;
            color: #fff;
            font-size: 1em;
            cursor: pointer;
            margin-top: 16px;
        }
    </style>

    <!-- 若採用正式流程（建議）：請使用 Tailwind CLI 產生精簡 CSS，然後將編譯後 CSS 貼入 tailwind.html，並在此用 template include 引入：
         注意：要啟用下面 include，server 端的 doGet 必須回傳 createTemplateFromFile('index').evaluate()（見說明）
         範例（已註解）： <?!= include('tailwind') ?>
    -->
</head>

<body>
    <header id="navbar" class="hidden fixed inset-x-0 top-0 bg-white/95 backdrop-blur-md border-b border-gray-100 z-40">
        <nav class="w-full px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center gap-4">
                    <a href="#" class="text-2xl font-semibold text-gray-800"><span id="school-name"
                            class="mr-2"></span>定期考考卷上傳系統</a>
                </div>
                <div class="hidden md:flex items-center gap-6">
                    <div id="nav-user" class="text-sm md:text-base text-gray-700"></div>
                </div>
                <div class="md:hidden">
                    <button id="nav-toggle" aria-expanded="false" aria-controls="mobile-menu" onclick="toggleNav()"
                        class="p-2 rounded-md text-gray-600 hover:bg-gray-100 focus:outline-none focus:ring-2 focus:ring-blue-300">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                            xmlns="http://www.w3.org/2000/svg">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M4 6h16M4 12h16M4 18h16"></path>
                        </svg>
                    </button>
                </div>
            </div>
        </nav>
        <div id="mobile-menu" class="md:hidden hidden px-4 pb-4">
            <div id="nav-email-mobile" class="mt-2 text-sm text-gray-700"></div>
        </div>
    </header>

    <!-- 將原本 container 保留，但同時示範加入 Tailwind utility class（開發測試用） -->
    <div class="container mx-auto max-w-md mt-20 bg-white rounded-lg shadow-lg p-8" id="main-container">
        <h1 class="text-2xl font-semibold text-center text-gray-800">定期考考卷上傳系統</h1>
        <div id="auth-section" class="mt-6 space-y-4">
            <div id="signin-message" class="email text-gray-700">正在初始化 Google 登入...</div>
            <div id="gis-button-wrapper" class="flex justify-center"></div>
            <button id="fallback-login-btn"
                class="login-btn w-full py-3 rounded-md bg-blue-600 text-white hover:bg-blue-700 hidden"
                onclick="login()">手動重新嘗試登入</button>
        </div>
        <div id="domain-prompt" style="margin-top:12px;color:#444"></div>
    </div>
    <!-- 未授權提示 Modal -->
    <div id="domain-modal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center z-50">
        <div class="bg-white rounded-lg p-6 max-w-md w-full mx-4">
            <h2 class="text-lg font-semibold text-gray-800">授權說明</h2>
            <p id="domain-modal-msg" class="mt-3 text-sm text-gray-700"></p>
            <div class="mt-4 flex justify-end gap-2">
                <a id="domain-login-link" class="inline-block px-4 py-2 bg-blue-600 text-white rounded-md" href="#"
                    target="_blank" rel="noopener">前往自訂網域 Gmail 登入</a>
                <button onclick="closeDomainModal()" class="px-4 py-2 rounded-md border">關閉</button>
            </div>
        </div>
    </div>
    <script>
        let authConfig = {clientId: "", allowedDomain: ""};
        let gisReady = false;
        let gisInitAttempts = 0;

        function escapeHtml(unsafe) {
            if (!unsafe) return "";
            return String(unsafe)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        function resetAuthSection() {
            const section = document.getElementById("auth-section");
            if (section) section.classList.remove("hidden");
        }

        function setAuthMessage(html) {
            const messageEl = document.getElementById("signin-message");
            if (messageEl) messageEl.innerHTML = html;
        }

        function toggleFallbackButton(show) {
            const btn = document.getElementById("fallback-login-btn");
            if (!btn) return;
            if (show) btn.classList.remove("hidden");
            else btn.classList.add("hidden");
        }

        function clearGisButton() {
            const wrapper = document.getElementById("gis-button-wrapper");
            if (wrapper) wrapper.innerHTML = "";
        }

        function renderGisButton() {
            if (!gisReady) return;
            const wrapper = document.getElementById("gis-button-wrapper");
            if (!wrapper) return;
            wrapper.innerHTML = "";
            if (window.google && window.google.accounts && window.google.accounts.id) {
                window.google.accounts.id.renderButton(wrapper, {
                    theme: "filled_blue",
                    size: "large",
                    type: "standard",
                    text: "signin_with",
                    shape: "pill",
                    width: 280,
                });
            }
        }

        function showLoading() {
            resetAuthSection();
            toggleFallbackButton(false);
            clearGisButton();
            setAuthMessage('載入中 <span class="spinner" aria-hidden="true"></span>');
        }

        function showError(message) {
            resetAuthSection();
            setAuthMessage('<div class="email" style="color:#e00">錯誤：' + escapeHtml(message) + "</div>");
            toggleFallbackButton(true);
            renderGisButton();
        }

        function showLoginPrompt() {
            resetAuthSection();
            const hint = authConfig.allowedDomain
                ? "請使用 " + escapeHtml(authConfig.allowedDomain) + " Google 帳號登入。"
                : "請使用 Google 登入。";
            setAuthMessage('<div class="email">' + hint + "</div>");
            toggleFallbackButton(true);
            renderGisButton();
        }

        function updateDomainPrompt() {
            const prompt = document.getElementById("domain-prompt");
            if (!prompt) return;
            if (authConfig.allowedDomain) {
                prompt.innerText = "僅限 " + authConfig.allowedDomain + " 網域帳號登入。";
            } else {
                prompt.innerText = "";
            }
        }

        function applyAccessInfo(res) {
            if (!res || !res.email) {
                showLoginPrompt();
                showDomainModalForMissingEmail();
                return;
            }

            const navbar = document.getElementById("navbar");
            if (navbar) navbar.classList.remove("hidden");
            const displayName = res.name ? res.name + " 老師好( " + res.email + " )" : res.email;
            const navUser = document.getElementById("nav-user");
            if (navUser) navUser.innerText = displayName;
            const navEmailMobile = document.getElementById("nav-email-mobile");
            if (navEmailMobile) navEmailMobile.innerText = displayName;

            if (res.authorized) {
                const authSection = document.getElementById("auth-section");
                if (authSection) authSection.classList.add("hidden");
                setAuthMessage("");
                clearGisButton();
                toggleFallbackButton(false);
                const domainPrompt = document.getElementById("domain-prompt");
                if (domainPrompt) domainPrompt.innerText = "";
                const modal = document.getElementById("domain-modal");
                if (modal) modal.classList.add("hidden");
                return;
            }

            showLoginPrompt();

            const modal = document.getElementById("domain-modal");
            const modalMsg = document.getElementById("domain-modal-msg");
            const modalLink = document.getElementById("domain-login-link");
            const domain = (res.domain || authConfig.allowedDomain || "").toString();
            if (domain) {
                if (modalMsg) modalMsg.innerText = '您尚未登入 "' + domain + '" 的 Google 信箱帳號。';
                if (modalLink) {
                    modalLink.href = "https://mail.google.com/a/" + encodeURIComponent(domain) + "/";
                    modalLink.classList.remove("hidden");
                }
            } else {
                if (modalMsg) modalMsg.innerText = "您目前帳號未被授權，請聯絡系統管理員。";
                if (modalLink) {
                    modalLink.href = "#";
                    modalLink.classList.add("hidden");
                }
            }
            if (modal) modal.classList.remove("hidden");
        }

        function showDomainModalForMissingEmail() {
            const modal = document.getElementById("domain-modal");
            const modalMsg = document.getElementById("domain-modal-msg");
            const modalLink = document.getElementById("domain-login-link");
            const domain = authConfig.allowedDomain;
            if (domain) {
                if (modalMsg) modalMsg.innerText = "請使用學校帳號登入（網域：" + domain + "）。";
                if (modalLink) {
                    modalLink.href = "https://mail.google.com/a/" + encodeURIComponent(domain) + "/";
                    modalLink.classList.remove("hidden");
                }
                if (modal) modal.classList.remove("hidden");
                return;
            }

            if (typeof google === "undefined" || !google.script) {
                if (modalMsg) modalMsg.innerText = "尚未取得登入資訊，請嘗試使用 Google 登入或聯絡系統管理員。";
                if (modalLink) {
                    modalLink.href = "#";
                    modalLink.classList.add("hidden");
                }
                if (modal) modal.classList.remove("hidden");
                return;
            }

            google.script.run
                .withSuccessHandler(function (settings) {
                    const domainSetting = settings && settings["使用者信箱網域"] ? settings["使用者信箱網域"] : "";
                    if (domainSetting) {
                        if (modalMsg) modalMsg.innerText = "請使用學校帳號登入（網域：" + domainSetting + "）。";
                        if (modalLink) {
                            modalLink.href = "https://mail.google.com/a/" + encodeURIComponent(domainSetting) + "/";
                            modalLink.classList.remove("hidden");
                        }
                    } else {
                        if (modalMsg) modalMsg.innerText = "尚未設定可登入的信箱網域，請聯絡系統管理員。";
                        if (modalLink) {
                            modalLink.href = "#";
                            modalLink.classList.add("hidden");
                        }
                    }
                    if (modal) modal.classList.remove("hidden");
                })
                .withFailureHandler(function () {
                    if (modalMsg) modalMsg.innerText = "無法取得系統設定，請稍後再試或聯絡系統管理員。";
                    if (modalLink) {
                        modalLink.href = "#";
                        modalLink.classList.add("hidden");
                    }
                    if (modal) modal.classList.remove("hidden");
                })
                .getSettingsAsObject();
        }

        function handleCredentialResponse(response) {
            if (!response || !response.credential) {
                showError("無法取得 Google 登入憑證，請重新嘗試。");
                return;
            }

            showLoading();

            if (typeof google === "undefined" || !google.script) {
                showError("google.script 未載入；請以 Apps Script Web App 方式開啟此頁面。");
                return;
            }

            google.script.run
                .withSuccessHandler(function (info) {
                    applyAccessInfo(info);
                })
                .withFailureHandler(function (err) {
                    const msg = err && err.message ? err.message : JSON.stringify(err);
                    showError(msg);
                })
                .verifyIdToken(response.credential);
        }

        function fetchUserAccessInfo() {
            showLoading();

            if (typeof google === "undefined" || !google.script) {
                showError("google.script 未載入；請以 Apps Script Web App 方式開啟此頁面。");
                return;
            }

            google.script.run
                .withSuccessHandler(function (res) {
                    applyAccessInfo(res);
                })
                .withFailureHandler(function (err) {
                    const msg = err && err.message ? err.message : JSON.stringify(err);
                    showError(msg);
                })
                .getUserAccessInfo();
        }

        function fetchAuthConfig() {
            if (typeof google === "undefined" || !google.script) return;

            google.script.run
                .withSuccessHandler(function (config) {
                    authConfig = config || {clientId: "", allowedDomain: ""};
                    updateDomainPrompt();
                    setupGisClient();
                })
                .withFailureHandler(function (err) {
                    console.warn("getAuthConfig failed", err);
                    authConfig = {clientId: "", allowedDomain: ""};
                    showLoginPrompt();
                })
                .getAuthConfig();
        }

        function setupGisClient() {
            if (!authConfig.clientId) {
                console.warn("缺少 GIS client ID Script Property");
                showError("尚未設定 Google Identity Services client ID，請聯絡系統管理員。");
                return;
            }

            if (!window.google || !window.google.accounts || !window.google.accounts.id) {
                if (gisInitAttempts < 10) {
                    gisInitAttempts += 1;
                    setTimeout(setupGisClient, 400);
                } else {
                    console.warn("Google Identity Services script 未載入");
                }
                return;
            }

            if (gisReady) {
                renderGisButton();
                return;
            }

            window.google.accounts.id.initialize({
                client_id: authConfig.clientId,
                callback: handleCredentialResponse,
                auto_select: false,
                cancel_on_tap_outside: true,
            });

            gisReady = true;
            renderGisButton();
        }

        function login() {
            if (gisReady && window.google && window.google.accounts && window.google.accounts.id) {
                window.google.accounts.id.prompt();
            } else {
                fetchUserAccessInfo();
            }
        }

        function logout() {
            showDomainModalForMissingEmail();
        }

        function closeDomainModal() {
            const modal = document.getElementById("domain-modal");
            if (modal) modal.classList.add("hidden");
        }

        function toggleNav() {
            const btn = document.getElementById("nav-toggle");
            const menu = document.getElementById("mobile-menu");
            if (!menu || !btn) return;
            const expanded = btn.getAttribute("aria-expanded") === "true";
            btn.setAttribute("aria-expanded", String(!expanded));
            menu.classList.toggle("hidden");
        }

        function fetchSettings() {
            if (typeof google === "undefined" || !google.script) return;
            google.script.run
                .withSuccessHandler(function (settings) {
                    try {
                        const school = settings && settings["學校名稱"] ? settings["學校名稱"] : "";
                        const el = document.getElementById("school-name");
                        if (el) el.innerText = school ? school : "";
                        const modalLink = document.getElementById("domain-login-link");
                        if (modalLink) {
                            modalLink.innerText = school ? ("前往 " + school + " Gmail 登入") : "前往自訂網域 Gmail 登入";
                        }
                    } catch (e) {
                        console.error("fetchSettings handler error", e);
                    }
                })
                .withFailureHandler(function (err) {
                    console.warn("getSettingsAsObject failed", err);
                })
                .getSettingsAsObject();
        }

        window.onload = function () {
            fetchSettings();
            fetchAuthConfig();
            fetchUserAccessInfo();
        };
    </script>

    <style>
        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #0070f3;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-left: 8px;
            vertical-align: middle;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</body>

</html>
